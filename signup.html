<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Habit Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-mark">⚗</span>Habit Lab</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Start your first habit experiment today.</p>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
          <div class="error" id="name-error"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <div class="error" id="email-error"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
          <div class="hint">At least 8 characters, including a number.</div>
          <div class="error" id="password-error"></div>
        </div>

        <div class="field">
          <label for="goal">What do you want to work on first?</label>
          <select id="goal" name="goal" required>
            <option value="">Choose one…</option>
            <option value="sleep">Better sleep</option>
            <option value="focus">More focus</option>
            <option value="movement">Moving more</option>
            <option value="mood">Mood and stress</option>
            <option value="other">Something else</option>
          </select>
          <div class="error" id="goal-error"></div>
        </div>

        <div class="field">
          <label class="checkbox">
            <input type="checkbox" id="terms" name="terms" required>
            <span>I agree to the Terms of Service and Privacy Policy.</span>
          </label>
          <div class="error" id="terms-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-foot">Already have an account? <a href="#">Log in</a></p>
    </div>
  </main>

  <script src="signup.js"></script>
</body>
</html>
