    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-title" content="Habit Lab" />

    <meta name="description" content="The Habit Lab: guided cohorts for changing habits, with weekly meditation, daily check-ins and live sessions." />

    <meta property="og:type" content="website" />

    <meta property="og:description" content="Change one habit at a time, together: a weekly breathing meditation, a short daily check-in and a live session every Monday." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
