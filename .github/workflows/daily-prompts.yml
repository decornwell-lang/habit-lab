# Every hour, asks the app to send the daily prompts (morning, meditation,
# reflection, check-in) to members whose local time matches. The app does the
# time-zone maths (api/daily-prompts.js; times in src/content/dailyPrompts.js).
# Needs a repository secret named CRON_SECRET (Settings → Secrets and variables → Actions),
# matching CRON_SECRET in Vercel.
name: Daily prompts

on:
  schedule:
    - cron: "2 * * * *" # a couple of minutes past every hour
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily prompts
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://habit-lab-two.vercel.app/api/daily-prompts
