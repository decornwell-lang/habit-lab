<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome — Habit Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-mark">⚗</span>Habit Lab</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="success-icon">✓</div>
      <h1 id="greeting">You're in!</h1>
      <p class="sub" id="message">Your account is ready. Next, we'll set up your first experiment.</p>
      <a href="index.html" class="btn btn-primary btn-block">Back to home</a>
    </div>
  </main>

  <script>
    const goals = {
      sleep: "better sleep",
      focus: "more focus",
      movement: "moving more",
      mood: "mood and stress",
      other: "your goal",
    };
    try {
      const user = JSON.parse(localStorage.getItem("habitlab:user"));
      if (user) {
        document.getElementById("greeting").textContent = `Welcome, ${user.name.split(" ")[0]}!`;
        document.getElementById("message").textContent =
          `Your account is ready. Next, we'll set up your first experiment for ${goals[user.goal] || "your goal"}.`;
      }
    } catch (e) {}
  </script>
</body>
</html>
